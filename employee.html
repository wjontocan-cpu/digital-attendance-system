
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees | Digital Attendance System</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .employee-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #102b50;
            color: white;
            padding: 25px 18px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-brand {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        .sidebar a {
            display: block;
            padding: 13px 15px;
            margin-bottom: 8px;
            color: #dce7f5;
            text-decoration: none;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2463b4;
            color: white;
        }

        .logout-link {
            margin-top: auto;
            background: #c0392b;
            cursor: pointer;
        }

        .employee-main {
            flex: 1;
            padding: 30px;
            min-width: 0;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: #102b50;
            margin: 0;
            font-size: 28px;
        }

        .page-header p {
            color: #64748b;
            margin-top: 8px;
        }

        .employee-content {
            display: grid;
            grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
            gap: 25px;
            align-items: start;
        }

        .content-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .content-card h2 {
            color: #102b50;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2463b4;
            box-shadow: 0 0 0 3px rgba(36,99,180,0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .save-button {
            width: 100%;
            padding: 13px;
            background: #2463b4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .save-button:hover {
            background: #174a88;
        }

        .employee-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .employee-list-header h2 {
            margin: 0;
        }

        .search-box {
            width: 230px;
            max-width: 100%;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        .department-folder {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            background: #fff;
        }

        .department-folder h3 {
            background: #edf4ff;
            color: #174a88;
            margin: 0;
            padding: 15px;
            font-size: 16px;
        }

        .department-folder > p {
            color: #64748b;
            font-size: 13px;
            padding: 0 15px;
        }

        .department-employee-list {
            padding: 10px 15px 15px;
        }

        .employee-item {
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .employee-item strong {
            color: #102b50;
            font-size: 15px;
        }

        .employee-item p {
            color: #64748b;
            font-size: 13px;
            margin: 7px 0;
        }

        .employee-item button {
            padding: 7px 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px 5px 0 0;
            font-weight: 600;
        }

        .employee-item button:first-of-type {
            background: #e0edff;
            color: #174a88;
        }

        .employee-item button:last-of-type {
            background: #fee2e2;
            color: #b91c1c;
        }

        .empty-message {
            color: #94a3b8;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 1100px) {
            .employee-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            .employee-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .employee-main {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="employee-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            Digital Attendance System
        </div>

        <a href="dashboard.html">⌂ Home</a>
        <a href="employee.html" class="active">▣ Employees</a>
        <a href="#registration">＋ Employee Registration</a>
        <a href="attendance.html">◷ Attendance Record</a>
        <a href="monthly-record.html">▤ Monthly Record</a>

        <a href="#" class="logout-link" onclick="logout(); return false;">
            ↪ Logout
        </a>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="employee-main">

        <header class="page-header">
            <h1>Employee Management</h1>
            <p>Register, manage, and organize faculty and staff employees.</p>
        </header>

        <div class="employee-content">

            <!-- EMPLOYEE REGISTRATION -->
            <section class="content-card" id="registration">

                <h2>Employee Registration</h2>

                <form id="employeeRegistrationForm">

                    <div class="form-group">
                        <label for="employeeID">Employee ID</label>
                        <input
                            type="text"
                            id="employeeID"
                            placeholder="Enter Employee ID"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="employeeName">Employee Name</label>
                        <input
                            type="text"
                            id="employeeName"
                            placeholder="Enter Employee Name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="employeePosition">Position</label>
                        <select id="employeePosition" required>
                            <option value="">Select Position</option>
                            <option value="Faculty">Faculty</option>
                            <option value="Staff">Staff</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="employeeDepartment">Department</label>
                        <select id="employeeDepartment" required>
                            <option value="">Select Department</option>
                            <option value="BSCRIM">BSCRIM</option>
                            <option value="BSIT">BSIT</option>
                            <option value="BSHM">BSHM</option>
                            <option value="BSED">BSED</option>
                            <option value="BSBA">BSBA</option>
                            <option value="BEED">BEED</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="employeePassword">Personal Password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="employeePassword"
                                placeholder="Create Personal Password"
                                required
                                minlength="6"
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                aria-label="Toggle password visibility"
                            >
                                👁
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="save-button">
                        Save Employee
                    </button>

                </form>

            </section>

            <!-- EMPLOYEE LIST -->
            <section class="content-card">

                <div class="employee-list-header">
                    <h2>Registered Employees</h2>

                    <input
                        type="search"
                        id="employeeSearch"
                        class="search-box"
                        placeholder="Search employee..."
                    >
                </div>

                <div id="employeesList">
                    <p class="empty-message">
                        No registered employees yet.
                    </p>
                </div>

            </section>

        </div>

    </main>

</div>

<script src="script.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        if (typeof checkAdminSession === "function") {
            checkAdminSession();
        }

        const form = document.getElementById("employeeRegistrationForm");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const employeeData = {
                employeeID: document.getElementById("employeeID").value.trim(),
                name: document.getElementById("employeeName").value.trim(),
                position: document.getElementById("employeePosition").value,
                department: document.getElementById("employeeDepartment").value,
                password: document.getElementById("employeePassword").value
            };

            if (typeof registerEmployee === "function") {
                const success = registerEmployee(employeeData);

                if (success) {
                    form.reset();
                    displayEmployees();
                }
            } else {
                alert("Employee registration function is not available.");
            }
        });

        const searchInput = document.getElementById("employeeSearch");

        searchInput.addEventListener("input", function () {
            filterEmployeeFolders(this.value);
        });

        displayEmployees();

    });

    function filterEmployeeFolders(keyword) {
        const folders = document.querySelectorAll(".department-folder");

        folders.forEach(folder => {
            const employeeItems = folder.querySelectorAll(".employee-item");
            let visibleCount = 0;

            employeeItems.forEach(item => {
                const text = item.textContent.toLowerCase();

                if (text.includes(keyword.toLowerCase())) {
                    item.style.display = "";
                    visibleCount++;
                } else {
                    item.style.display = "none";
                }
            });

            folder.style.display =
                visibleCount > 0 || keyword.trim() === ""
                    ? ""
                    : "none";
        });
    }
</script>

</body>
</html>

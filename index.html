
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Attendance System</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-page">

        <div class="login-container">

            <!-- LEFT SIDE -->
            <div class="login-left">

                <div class="brand">
                    <div class="brand-icon">DA</div>
                    <span>Digital Attendance</span>
                </div>

                <div class="welcome-content">
                    <h1>Digital Attendance System</h1>

                    <p class="tagline">
                        Track. Manage. Monitor.
                    </p>

                    <p class="description">
                        A simple and efficient attendance management
                        system designed for faculty and staff.
                    </p>
                </div>

                <div class="login-footer">
                    © 2026 Digital Attendance System
                </div>

            </div>

            <!-- RIGHT SIDE -->
            <div class="login-right">

                <div class="login-form-wrapper">

                    <div class="form-heading">
                        <h2>Admin Login</h2>
                        <p>Sign in to access your dashboard.</p>
                    </div>

                    <form id="adminLoginForm">

                        <div class="form-group">
                            <label for="username">Username</label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                required
                                autocomplete="username"
                            >
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>

                            <div class="password-wrapper">
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                    required
                                    autocomplete="current-password"
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    id="togglePassword"
                                    aria-label="Show password"
                                >
                                    👁
                                </button>
                            </div>
                        </div>

                        <div class="forgot-password">
                            <a href="#" id="forgotPassword">
                                Forgot Password?
                            </a>
                        </div>

                        <button type="submit" class="login-button">
                            Sign In
                        </button>

                        <p id="loginMessage" class="login-message"></p>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
